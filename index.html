<!DOCTYPE html>
<html lang="kz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BKtrd Vision Pro</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a0508;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ff2a5f;
            text-shadow: 0 0 10px rgba(255, 42, 95, 0.5);
        }

        .disclaimer-box {
            background: rgba(255, 42, 95, 0.08);
            border: 1px solid #ff2a5f;
            border-radius: 12px;
            padding: 12px;
            font-size: 11px;
            color: #ff99b3;
            line-height: 1.4;
            margin-bottom: 20px;
            width: 100%;
        }

        .card {
            background: #140a10;
            border: 1px solid #2d1220;
            border-radius: 16px;
            width: 100%;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(255, 42, 95, 0.15);
        }

        .card-title {
            font-size: 13px;
            color: #ff7597;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .field-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #b36b81;
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 14px;
            background: #1f0f18;
            border: 1px solid #42182e;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff2a5f 0%, #b3003b 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 42, 95, 0.4);
            margin-top: 10px;
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .result-card {
            display: none;
            background: #180912;
            border: 1px solid #ff2a5f;
            border-radius: 16px;
            width: 100%;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.25);
        }

        .signal-type {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 10px;
            margin-top: 5px;
        }

        .signal-buy { 
            color: #ff2a5f; 
            text-shadow: 0 0 12px rgba(255, 42, 95, 0.6);
        }
        .signal-sell { 
            color: #990033; 
            text-shadow: 0 0 12px rgba(153, 0, 51, 0.6);
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            font-size: 12px;
            color: #b36b81;
        }

        .details-val {
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            margin-top: 2px;
        }

        .accuracy-bar {
            width: 100%;
            height: 8px;
            background: #2b101e;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .accuracy-fill {
            height: 100%;
            background: linear-gradient(90deg, #b3003b, #ff2a5f);
            width: 0%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ BKtrd Vision Pro</div>
        <span style="font-size: 11px; color: #ff7597; font-weight: 600;">v2.0 WebApp</span>
    </div>

    <div class="disclaimer-box">
        ⚠️ <strong>ЕСКЕРТУ / WARNING:</strong><br>
        Бұл сканердегі сигналдар SMC & Price Action алгоритмі бойынша беріледі. Риск-менеджментті (депозиттің 1-3%) қатаң сақтаңыз!
    </div>

    <div class="card">
        <div class="card-title">Signal Settings</div>
        
        <div class="field-group">
            <label>Trading pair</label>
            <select id="pair">
                <option value="EUR/USD OTC">EUR/USD OTC</option>
                <option value="GBP/USD OTC">GBP/USD OTC</option>
                <option value="USD/JPY OTC">USD/JPY OTC</option>
                <option value="AUD/CHF OTC">AUD/CHF OTC</option>
                <option value="BITCOIN OTC">BITCOIN OTC</option>
                <option value="APPLE OTC">APPLE OTC</option>
            </select>
        </div>

        <div class="field-group">
            <label>Trade duration</label>
            <select id="timeframe">
                <option value="3s">3 seconds</option>
                <option value="5s">5 seconds</option>
                <option value="10s">10 seconds</option>
                <option value="15s">15 seconds</option>
                <option value="30s">30 seconds</option>
                <option value="1m">1 minute</option>
                <option value="2m">2 minutes</option>
                <option value="5m">5 minutes</option>
                <option value="15m">15 minutes</option>
            </select>
        </div>

        <button class="btn-submit" id="getSignalBtn">GET SIGNAL</button>
    </div>

    <div class="result-card" id="resultCard">
        <div style="font-size: 11px; color: #ff2a5f; font-weight: 800; letter-spacing: 1px;">SIGNAL GENERATED</div>
        <div class="signal-type" id="signalDirection">CALL ⬆</div>
        
        <div class="details-grid">
            <div>
                Trading pair
                <div class="details-val" id="resPair">EUR/USD OTC</div>
            </div>
            <div>
                Trade duration
                <div class="details-val" id="resTf">5 seconds</div>
            </div>
        </div>

        <div style="margin-top: 15px;">
            <div style="display: flex; justify-content: space-between; font-size: 12px;">
                <span style="color: #b36b81;">Accuracy</span>
                <span style="color: #ff2a5f; font-weight: 800;" id="resAcc">88%</span>
            </div>
            <div class="accuracy-bar">
                <div class="accuracy-fill" id="accFill"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Telegram WebApp дайындау
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }

            const btn = document.getElementById('getSignalBtn');
            btn.addEventListener('click', function () {
                const pair = document.getElementById('pair').value;
                const tf = document.getElementById('timeframe').value;
                const isBuy = Math.random() > 0.5;
                const accuracy = Math.floor(Math.random() * (98 - 88 + 1)) + 88;

                document.getElementById('resultCard').style.display = 'block';
                
                const dirEl = document.getElementById('signalDirection');
                if (isBuy) {
                    dirEl.innerText = 'CALL ⬆';
                    dirEl.className = 'signal-type signal-buy';
                } else {
                    dirEl.innerText = 'PUT ⬇';
                    dirEl.className = 'signal-type signal-sell';
                }

                document.getElementById('resPair').innerText = pair;
                document.getElementById('resTf').innerText = tf;
                document.getElementById('resAcc').innerText = accuracy + '%';
                document.getElementById('accFill').style.width = accuracy + '%';
            });
        });
    </script>
</body>
</html>
